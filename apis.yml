features:
  - name: Read-Only JSON Catalog
    description: >-
      Static JSON representations of boards, threads, catalogs, and archives are served from a.4cdn.org; clients use
      standard HTTP semantics including If-Modified-Since for caching.
  - name: No Authentication
    description: >-
      The API requires no API key, no token, and no account; it is fully anonymous and serves the same data visible to
      anonymous web visitors.
  - name: HTTP Caching Built In
    description: >-
      The API requires clients to send If-Modified-Since headers on repeated requests, allowing 304 Not Modified
      responses and reducing server load.
  - name: CORS Restricted to 4chan Origins
    description: >-
      CORS is enabled but only for origins boards.4chan.org and boards.4channel.org via HTTP or HTTPS; only
      GET/OPTIONS/HEAD methods are accepted.
  - name: Per-Board Catalog
    description: >-
      Every board (a, b, g, pol, po, etc.) exposes catalog, threadlist, archive, and per-page index endpoints with the
      same shape, making bulk crawling trivial.
  - name: Static Media Domains
    description: >-
      User-uploaded images and thumbnails live at i.4cdn.org/{board}/{tim}.{ext}; static site assets including flags,
      spoiler images, and capcode icons live at s.4cdn.org.
useCases:
  - name: Read-Only Board Crawlers
    description: >-
      Build research crawlers that periodically snapshot board catalogs, threads, and archives while respecting the 1
      request per second limit and 10 second per-thread refresh floor.
  - name: Thread Archivers
    description: >-
      Mirror archived threads and their attached media to durable storage for academic study or cultural preservation
      (see BA Thread Archiver, Ayase / Asagi).
  - name: Imageboard Analytics
    description: >-
      Use threads.json and catalog.json to chart posting volume, reply velocity, and moderator/admin capcode activity
      across boards over time.
  - name: Language Models and Markov Chains
    description: >-
      Feed cleaned post comments from catalog.json and thread.json into text generation experiments (see
      4chanMarkovText).
  - name: Static Site Mirrors
    description: >-
      Combine boards.json + per-board catalog/thread JSON to build static site mirrors of individual threads suitable
      for read-only display.
integrations:
  - name: BASC-py4chan
    description: Python wrapper providing Pythonic access to boards, threads, and posts.
  - name: 4chanjs
    description: Node.js and browser client for the 4chan JSON API.
  - name: go-4chan-api
    description: Go client for crawling and consuming 4chan board JSON.
  - name: rchan
    description: Rust crate exposing typed boards/threads/posts and a basic client.
  - name: Ayase / Asagi
    description: Archive middleware that ingests 4chan JSON and stores posts in SQL for replay.
  - name: chan-mcp-server (community)
    description: Unofficial Model Context Protocol server exposing 4chan boards/threads/catalog as MCP tools.
solutions:
  - name: Imageboard Research Archive
    description: >-
      Combine threads.json polling with archive.json snapshots and i.4cdn.org media downloads to build a long-term
      archive that respects the published rate limits.
  - name: Capcode Activity Dashboard
    description: Use catalog.json/thread.json capcode and id fields to surface moderator and admin activity per board over time.
