aid: 4chan
name: 4chan
description: >-
  4chan is a simple image-based bulletin board where anyone can post comments and share images across topic-specific
  boards. 4chan exposes a read-only JSON API (launched September 2012) that serves the same board, thread, catalog, and
  archive data consumed by the public site via static JSON files at a.4cdn.org. The API supports GET/HEAD/OPTIONS only —
  there is no posting, authentication, or write surface.
