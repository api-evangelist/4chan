naftiko: "1.0.0-alpha2"

info:
  label: "4chan Read-Only JSON API — Threadlist"
  description: >-
    Boards — Threadlist. 1 operation. Lead operation: 4chan Get Board Threadlist.
    Self-contained Naftiko capability covering one 4chan business surface.
  tags:
    - 4chan
    - Imageboard
    - Threadlist
  created: "2026-05-28"
  modified: "2026-05-28"

binds: []

capability:

  consumes:
    - type: http
      namespace: 4chan-api-threadlist
      baseUri: https://a.4cdn.org
      description: "4chan Read-Only JSON API — Threadlist business capability. Self-contained, no shared references."
      resources:
        - name: board-threads-json
          path: /{board}/threads.json
          operations:
            - name: getboardthreadlist
              method: GET
              description: 4chan Get Board Threadlist
              inputParameters:
                - name: board
                  in: path
                  type: string
                  required: true
                  description: Board directory short name (e.g. `po`, `g`, `pol`).
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      namespace: 4chan-api-threadlist-rest
      port: 8080
      description: "REST adapter for 4chan Read-Only JSON API — Threadlist."
      resources:
        - path: /v1/boards/{board}/threadlist
          name: board-threadlist
          description: REST surface for the per-board threadlist.
          operations:
            - method: GET
              name: getboardthreadlist
              description: 4chan Get Board Threadlist
              call: "4chan-api-threadlist.getboardthreadlist"
              with:
                board: "rest.board"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      namespace: 4chan-api-threadlist-mcp
      port: 9090
      transport: http
      description: "MCP adapter for 4chan Read-Only JSON API — Threadlist."
      tools:
        - name: list-board-threadlist
          description: 4chan Get Board Threadlist
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: "4chan-api-threadlist.getboardthreadlist"
          with:
            board: "tools.board"
          outputParameters:
            - type: object
              mapping: "$."
